  push-ecr:
      name: Build & Push ECR Image
      needs: integration
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v3

        - name: Write .env file
          run: |
            echo "${{ secrets.ENV_FILE }}" | base64 -d > api/.env
            ls -la api/.env

        - name: Build Docker image
          run: |
            docker build -t mental-exploring-api:latest -f api/docker/Dockerfile api/

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v1
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}

        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v1

        - name: Tag and Push Docker Image
          env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
            IMAGE_TAG: latest
          run: |
            docker tag mental-exploring-api:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    name: Deploy to Self-Hosted
    needs: push-ecr
    runs-on: [self-hosted, api-runner]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Pull latest image
        run: |
          docker pull ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest

      - name: Stop old container if exists
        run: |
          docker ps -q --filter "name=mental-api" | grep -q . && docker stop mental-api && docker rm -fv mental-api || echo "No existing container"

      - name: Write .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" | base64 -d > api/.env
          ls -la api/.env

      - name: Run new container
        run: |
          docker run -d --name mental-api -p 8080:8080 ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest

      - name: Clean up .env file
        run: rm -f .env

      - name: Clean old images
        run: docker system prune -f