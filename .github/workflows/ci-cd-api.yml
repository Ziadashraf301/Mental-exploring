name: Mental Exploring API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'

permissions:
  id-token: write
  contents: read

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Decode .env.test
        run: |
          echo "${{ secrets.ENV_TEST_FILE }}" | base64 -d > api/.env.test
          ls -la api/.env.test

      - name: Start Docker Compose
        run: |
          docker-compose -f docker-compose.test.yml up -d --build

      - name: Wait for API to become healthy
        run: |
          for i in {1..20}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "API is ready!"
              exit 0
            else
              echo "Waiting for API..."
              sleep 5
            fi
          done
          echo "API did not start in time!"
          docker-compose -f docker-compose.test.yml logs
          exit 1

      - name: Run Full API Tests
        run: |
          echo "Starting full API tests..."
          set -o errexit   # Exit on error
          set -o pipefail  # Fail if any command in a pipe fails
          python -u api/test/test_api.py

      - name: Shutdown Docker Compose
        run: |
          docker-compose -f docker-compose.test.yml down -v

  push-ecr:
    name: Build & Push ECR Image
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Decode .env
        run: |
          echo "${{ secrets.ENV_FILE }}" | base64 -d > api/.env
          ls -la api/.env

      - name: Build Docker Image
        run: docker build -t mental-exploring-api:latest -f api/docker/Dockerfile api/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Tag and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: latest
        run: |
          docker tag mental-exploring-api:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    name: Deploy to Self-Hosted Runner
    needs: push-ecr
    runs-on: [self-hosted, api-runner]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Pull Latest Image
        run: docker pull ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest

      - name: Clean Docker & Runner Logs
        run: |
          docker system prune -af --volumes
          sudo rm -rf ~/actions-runner/_diag/*.log
          sudo journalctl --vacuum-size=200M
          sudo apt-get clean
          sudo rm -rf /tmp/*

      - name: Decode .env
        run: |
          echo "${{ secrets.ENV_FILE }}" | base64 -d > api/.env
          ls -la api/.env

      - name: Run Container
        run: |
          docker run -d --name mental-api -p 8080:8080 ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest

      - name: Cleanup .env
        run: rm -f api/.env

      - name: Cleanup Old Images
        run: docker system prune -f
